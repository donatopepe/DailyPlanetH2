plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pepedonato'
version = '1.0.0'
description = 'DailyPlanetH2 - Portale di gestione ordini di lavoro (work orders portal)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Un solo artefatto pubblicato: il jar eseguibile di Spring Boot.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // Cross-platform: output UTF-8 identico su Linux, macOS e Windows.
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// Cross-platform: compilazione e runner sempre in UTF-8, indipendentemente dalla
// codifica di default del sistema (su Windows/Java 17 sarebbe la codifica ANSI locale,
// che romperebbe accenti italiani nei sorgenti, nei template Thymeleaf e nei log).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
