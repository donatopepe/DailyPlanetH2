<!DOCTYPE html>
<!-- Frammento di risposta al cambio password dell'utente autenticato. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="resultschangepw">
    <div class="alert" th:classappend="${alert != null and #strings.startsWith(alert, 'Change password successfully')} ? 'ok' : 'error'"
         th:if="${alert != null}">
        <span th:text="${alert}">esito</span>
    </div>
</div>
</body>
</html>
