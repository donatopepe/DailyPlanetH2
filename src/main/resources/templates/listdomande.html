<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/main :: head('Domande di lavoro')}"></head>
<body>
<header th:replace="~{layouts/main :: nav}"></header>

<main>
    <h1>Domande di lavoro</h1>

    <p th:if="${param.alert != null}" class="alert ok" th:text="${param.alert}">esito</p>

    <div class="card">
        <h2>Filtri</h2>
        <form method="get" th:action="@{/user/listdomande}">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
                <option value="">— tutte —</option>
                <option th:each="c : ${allCategorie}" th:value="${c}" th:text="${c}"
                        th:selected="${param.categoria != null and param.categoria[0] == c}">categoria</option>
            </select>

            <label for="utente">Autore (nome utente)</label>
            <input type="text" id="utente" name="utente" th:value="${param.utente != null ? param.utente[0] : ''}"/>

            <button type="submit">Filtra</button>
            <a class="button" th:href="@{/user/listdomande}">Azzera filtri</a>
        </form>
    </div>

    <div class="card">
        <h2 th:text="${intestazioneFiltro != null ? intestazioneFiltro : 'Tutte le domande'}">Tutte le domande</h2>
        <div th:replace="~{fragments/domande-table :: resultsList}"></div>
    </div>

    <p>
        <a class="button" th:href="@{/user/newdomanda}">Nuova domanda di lavoro</a>
        <a class="button" th:href="@{/user}">Torna all'area utente</a>
    </p>
</main>

<footer th:replace="~{layouts/main :: footer}"></footer>
</body>
</html>
