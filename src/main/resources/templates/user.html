<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/main :: head('Area utente')}"></head>
<body>
<header th:replace="~{layouts/main :: nav}"></header>

<main>
    <h1>Area utente</h1>

    <p th:if="${param.alert != null}" class="alert ok" th:text="${param.alert}">esito</p>
    <p th:if="${param.errore != null}" class="alert error" th:text="${param.errore}">errore</p>

    <div class="card">
        <h2>Azioni</h2>
        <p>
            <a class="button" th:href="@{/user/newdomanda}">Nuova domanda di lavoro</a>
            <a class="button" th:href="@{/user/listdomande}">Elenco domande</a>
            <a class="button" th:href="@{/user/edituser}">Modifica il tuo account</a>
            <a class="button" th:href="@{/user/changepw}">Cambia password</a>
        </p>
    </div>

    <div class="card">
        <h2>Filtro rapido per categoria</h2>
        <form method="get" th:action="@{/user/listdomande}">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required="required">
                <option th:each="c : ${allCategorie}" th:value="${c}" th:text="${c}">categoria</option>
            </select>
            <button type="submit">Mostra le domande della categoria</button>
        </form>
    </div>

    <div class="card">
        <h2>Utenti del portale</h2>
        <ul>
            <li th:each="u : ${allUser}" th:text="${u}">nome utente</li>
            <li th:if="${allUser == null or #lists.isEmpty(allUser)}">Nessun utente.</li>
        </ul>
    </div>
</main>

<footer th:replace="~{layouts/main :: footer}"></footer>
</body>
</html>
