<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/main :: head('Cambio password')}"></head>
<body>
<header th:replace="~{layouts/main :: nav}"></header>

<main>
    <h1>Cambio password</h1>

    <p th:if="${param.alert != null}" class="alert ok" th:text="${param.alert}">esito</p>
    <p th:if="${param.errore != null}" class="alert error" th:text="${param.errore}">errore</p>
    <p th:if="${forzato}" class="alert error">
        Per motivi di sicurezza devi impostare una nuova password prima di proseguire.
    </p>

    <form th:action="@{/user/doChangepw}" th:object="${ChangePwForm}" method="post">
        <input type="hidden" th:field="*{username}"/>

        <label for="password">Password attuale</label>
        <input type="password" id="password" th:field="*{password}" required="required"/>

        <label for="new_password">Nuova password (minimo 8 caratteri)</label>
        <input type="password" id="new_password" th:field="*{new_password}" required="required"/>
        <div class="errore-campo" th:if="${#fields.hasErrors('new_password')}" th:errors="*{new_password}">errore</div>

        <label for="confirm_password">Conferma nuova password</label>
        <input type="password" id="confirm_password" th:field="*{confirm_password}" required="required"/>

        <button type="submit">Cambia password</button>
        <a class="button" th:href="@{/user}">Annulla</a>
    </form>
</main>

<footer th:replace="~{layouts/main :: footer}"></footer>
</body>
</html>
