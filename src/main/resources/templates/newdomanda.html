<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/main :: head('Nuova domanda di lavoro')}"></head>
<body>
<header th:replace="~{layouts/main :: nav}"></header>

<main>
    <h1>Nuova domanda di lavoro</h1>

    <p th:if="${param.alert != null}" class="alert ok" th:text="${param.alert}">esito</p>
    <p th:if="${param.errore != null}" class="alert error" th:text="${param.errore}">errore</p>

    <!-- Form con invio normale (nessun JavaScript): funziona anche con JS disattivato. -->
    <form th:action="@{/user/doNewDomanda/SaveQuestion}" th:object="${domanda}" method="post">
        <input type="hidden" th:field="*{id_domanda}"/>

        <label for="titolo">Titolo (minimo 8 caratteri)</label>
        <input type="text" id="titolo" th:field="*{titolo}" required="required" maxlength="120"/>
        <div class="errore-campo" th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}">errore</div>

        <label for="descrizione">Descrizione (minimo 8 caratteri)</label>
        <textarea id="descrizione" th:field="*{descrizione}" rows="4" required="required"></textarea>
        <div class="errore-campo" th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}">errore</div>

        <label for="categoria">Categoria</label>
        <select id="categoria" th:field="*{categoria}" required="required">
            <option value="">— seleziona una categoria —</option>
            <option th:each="c : ${allCategorie}" th:value="${c}" th:text="${c}">categoria</option>
        </select>
        <p class="help-text">Se scrivi un nome non presente nell'elenco viene creata una nuova categoria.</p>

        <label>
            <input type="checkbox" th:field="*{closed}"/> domanda chiusa
        </label>

        <button type="submit">Salva domanda</button>
        <a class="button" th:href="@{/user}">Annulla</a>
    </form>

    <p><a th:href="@{/user/listdomande}">Vai all'elenco delle domande</a></p>
</main>

<footer th:replace="~{layouts/main :: footer}"></footer>
</body>
</html>
