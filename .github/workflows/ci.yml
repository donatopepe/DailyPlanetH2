name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Build + test su Linux, macOS e Windows con lo stesso comando (./gradlew):
  # è la prova che il progetto è cross-platform.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guardia di regressione: senza il wrapper versionato un clone pulito non compila
      # (l'errore reale era "Unable to access jarfile gradle/wrapper/gradle-wrapper.jar"
      # causato da una regola *.jar che annullava l'eccezione nel .gitignore).
      - name: Il wrapper Gradle è versionato
        shell: bash
        run: test -f gradle/wrapper/gradle-wrapper.jar

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # shell bash anche su Windows (Git Bash è presente nei runner): lo stesso comando
      # ./gradlew usato su Linux/macOS, senza rami specifici per sistema operativo.
      - name: Build e test
        shell: bash
        run: ./gradlew clean test --no-daemon

      - name: Report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore

  # Verifica che l'immagine si costruisca per entrambe le architetture
  # (linux/amd64 + linux/arm64) senza pubblicarla.
  docker-multiarch:
    name: Immagine Docker multi-architettura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (emulazione arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
