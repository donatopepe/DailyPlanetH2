# Stack completo: applicazione (profilo prod) + PostgreSQL.
#
# Uso:
#   cp .env.example .env      # poi modificare i valori
#   docker compose up --build
#   docker compose down       # aggiungere -v per cancellare anche il volume del database
#
# Nessun valore di default per le password: se mancano, compose si ferma con un messaggio
# esplicito e l'applicazione non parte.

name: dailyplaneth2

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dailyplanet}
      POSTGRES_USER: ${POSTGRES_USER:-dailyplanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD nel file .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dailyplanet} -d ${POSTGRES_DB:-dailyplanet}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dailyplaneth2:1.0.0-SNAPSHOT
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dailyplanet}
      DB_USERNAME: ${POSTGRES_USER:-dailyplanet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD nel file .env}
      DAILYPLANET_ADMIN_USERNAME: ${DAILYPLANET_ADMIN_USERNAME:-administrator}
      DAILYPLANET_ADMIN_EMAIL: ${DAILYPLANET_ADMIN_EMAIL:-admin@example.invalid}
      DAILYPLANET_ADMIN_PASSWORD: ${DAILYPLANET_ADMIN_PASSWORD:?impostare DAILYPLANET_ADMIN_PASSWORD nel file .env}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
